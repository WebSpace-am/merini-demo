<!doctype html>
<html lang="hy" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atelier | MERINI</title>
  <meta name="description" content="MERINI atelier: furniture designed and made in Armenia, sold straight from the manufacturer.">
  <meta name="theme-color" content="#F6F3EE">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1A30'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia' font-size='34' fill='%23D9C08E'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400..700;1,400..700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css?v=7">
</head>
<body data-page="atelier">
  <a class="skip-link" href="#main" data-i18n="nav.skip"></a>
  <header id="site-header"></header>

  <main id="main">
    <section class="page-hero" style="padding-bottom:0">
      <div class="container split split--rev">
        <div class="split-copy">
          <span class="eyebrow reveal" data-i18n="at.eyebrow"></span>
          <h1 class="display reveal" data-delay="1" data-i18n="at.title"></h1>
          <p class="lead reveal" data-delay="2" data-i18n="at.lead"></p>
        </div>
        <div class="frame ratio-45 img-reveal"><img src="assets/bed-light.jpg" alt="Alba bed in the morning light" width="503" height="410"></div>
      </div>
    </section>

    <section class="section quote-band">
      <div class="container">
        <span class="eyebrow eyebrow--plain">MERINI</span>
        <p class="reveal" data-i18n="at.quote"></p>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="section-head"><div><span class="eyebrow" data-i18n="at.process"></span></div></div>
        <ol class="steps">
          <li class="reveal"><span class="n">01</span><h3 data-i18n="at.s1.t"></h3><p data-i18n="at.s1.d"></p></li>
          <li class="reveal" data-delay="1"><span class="n">02</span><h3 data-i18n="at.s2.t"></h3><p data-i18n="at.s2.d"></p></li>
          <li class="reveal" data-delay="2"><span class="n">03</span><h3 data-i18n="at.s3.t"></h3><p data-i18n="at.s3.d"></p></li>
          <li class="reveal" data-delay="3"><span class="n">04</span><h3 data-i18n="at.s4.t"></h3><p data-i18n="at.s4.d"></p></li>
        </ol>
      </div>
    </section>

    <section class="band section">
      <div class="container">
        <ul class="stats">
          <li><strong data-count="56700" data-suffix="K">56.7K</strong><span data-i18n="at.n1"></span></li>
          <li><strong data-count="36000" data-suffix="K">36K</strong><span data-i18n="at.n2"></span></li>
          <li><strong data-count="2">2</strong><span data-i18n="at.n3"></span></li>
          <li><strong data-count="7">7</strong><span data-i18n="at.n4"></span></li>
        </ul>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow" data-i18n="at.eyebrow"></span>
            <h2 class="h2 reveal" data-i18n="at.materials"></h2>
            <p class="lead" data-i18n="at.materials.sub"></p>
          </div>
        </div>
        <div class="library">
          <figure class="lib-preview" id="lib-preview" style="margin:0"><figcaption></figcaption></figure>
          <div>
            <div class="tabs" id="lib-tabs" role="tablist"></div>
            <div class="lib-grid" id="lib-grid"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container split">
        <div class="frame ratio-54 img-reveal"><img src="assets/hallway.jpg" alt="Champagne hallway system" loading="lazy" width="491" height="435"></div>
        <div class="split-copy">
          <span class="eyebrow" data-i18n="visit.eyebrow"></span>
          <h2 class="h2 reveal" data-i18n="visit.title"></h2>
          <div class="contact-row">
            <a class="btn" href="showroom.html#book" data-i18n="nav.book"></a>
            <a class="btn btn--ghost" href="collections.html" data-i18n="hero.cta1"></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/data.js?v=7"></script>
  <script src="assets/js/i18n.js?v=7"></script>
  <script src="assets/js/main.js?v=7"></script>
  <script src="assets/js/pages.js?v=7"></script>
</body>
</html>
