<!doctype html>
<html lang="hy" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MERINI — Կահույք Երևանում · Furniture Yerevan</title>
  <meta name="description" content="MERINI Furniture, Yerevan: upholstered sofas, made-to-measure kitchens and wardrobes, straight from the manufacturer.">
  <meta name="theme-color" content="#F6F3EE">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1A30'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia' font-size='34' fill='%23D9C08E'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400..700;1,400..700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css?v=7">
</head>
<body data-page="home">
  <a class="skip-link" href="#main" data-i18n="nav.skip"></a>
  <header id="site-header" data-dark="1"></header>

  <main id="main">
    <!-- Full-screen hero -->
    <section class="hero-full" id="hero" aria-roledescription="carousel" aria-label="MERINI">
      <div class="hero-slides" id="hero-slides"></div>
      <div class="hero-shade" aria-hidden="true"></div>
      <div class="container hero-overlay">
        <div class="hero-caption" id="hero-caption" aria-live="polite">
          <span class="eyebrow hero-promise" data-i18n="hero.promise"></span>
          <p class="hero-name swap" id="hero-name"></p>
          <p class="hero-type swap" id="hero-type"></p>
          <a class="link swap" id="hero-link" href="collections.html"><span data-i18n="hero.discover"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        </div>
        <div class="hero-dots" id="hero-dots" role="tablist" aria-label="Slides"></div>
      </div>
      <button class="hero-down" type="button" id="hero-down" data-i18n-attr="aria-label:hero.scroll">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M6 14l6 6 6-6"/></svg>
      </button>
    </section>

    <!-- Manifesto -->
    <section class="manifesto" id="after-hero">
      <!-- Background film: Pexels video 10135156 (Pexels License, free to use) -->
      <div class="mf-bg" aria-hidden="true">
        <video id="mf-video" autoplay muted loop playsinline preload="auto" poster="assets/video/manifesto-poster.jpg">
          <source src="assets/video/manifesto-720.mp4" type="video/mp4">
        </video>
      </div>
      <div class="mf-shade" aria-hidden="true"></div>
      <div class="container manifesto-inner">
        <span class="eyebrow reveal" data-i18n="manifesto.eyebrow"></span>
        <h1 class="display mf-title" id="mf-title" data-i18n="hero.title"></h1>
        <p class="lead reveal" data-delay="2" data-i18n="hero.sub"></p>
        <div class="hero-actions reveal" data-delay="3">
          <a class="btn btn--light" href="collections.html"><span data-i18n="hero.cta1"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <a class="link" href="showroom.html" data-i18n="hero.cta2"></a>
        </div>
      </div>
      <button class="mf-toggle" id="mf-toggle" type="button" aria-controls="mf-video">
        <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="5" width="3.2" height="14" rx="1"/><rect x="13.8" y="5" width="3.2" height="14" rx="1"/></svg>
        <svg class="i-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 001.5.86l10.4-6.5a1 1 0 000-1.72L9.5 4.64A1 1 0 008 5.5z"/></svg>
        <span data-i18n="video.pause"></span>
      </button>
    </section>

    <!-- Marquee -->
    <section class="strip" aria-label="MERINI">
      <div class="strip-track">
        <ul>
          <li data-i18n="strip.1"></li><li data-i18n="strip.2"></li><li data-i18n="strip.3"></li><li data-i18n="strip.4"></li>
          <li data-i18n="strip.1"></li><li data-i18n="strip.2"></li><li data-i18n="strip.3"></li><li data-i18n="strip.4"></li>
        </ul>
        <ul aria-hidden="true">
          <li data-i18n="strip.1"></li><li data-i18n="strip.2"></li><li data-i18n="strip.3"></li><li data-i18n="strip.4"></li>
          <li data-i18n="strip.1"></li><li data-i18n="strip.2"></li><li data-i18n="strip.3"></li><li data-i18n="strip.4"></li>
        </ul>
      </div>
    </section>

    <!-- Collections -->
    <section class="section">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow" data-i18n="col.eyebrow"></span>
            <h2 class="h2 reveal" data-i18n="col.title"></h2>
          </div>
          <a class="link" href="collections.html"><span data-i18n="feat.all"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        </div>
        <div class="cat-grid" id="cat-grid"></div>
      </div>
    </section>

    <!-- Featured rail -->
    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow" data-i18n="feat.eyebrow"></span>
            <h2 class="h2 reveal" data-i18n="feat.title"></h2>
          </div>
          <a class="link" href="collections.html?cat=sofas"><span data-i18n="feat.all"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        </div>
        <div class="p-grid" id="featured" style="padding:0"></div>
      </div>
    </section>

    <!-- Configurator -->
    <section class="section cfg" id="configure">
      <div class="container cfg-grid">
        <div class="cfg-stage reveal">
          <div class="frame" id="cfg-stage">
            <img src="assets/sofa-lusso.jpg" alt="" width="517" height="441">
            <img class="is-out" src="assets/sofa-bordeaux.jpg" alt="" width="498" height="480">
          </div>
          <div class="cfg-swatch-disc" id="cfg-disc" aria-hidden="true"><i></i><span><small data-i18n="cfg.sample"></small><b id="cfg-disc-name"></b></span></div>
        </div>
        <div class="cfg-panel">
          <div style="display:grid;gap:18px">
            <span class="eyebrow" data-i18n="cfg.eyebrow"></span>
            <h2 class="h2" data-i18n="cfg.title"></h2>
          </div>
          <div>
            <span class="field-label" id="lbl-shape" data-i18n="cfg.shape"></span>
            <div class="segmented" id="cfg-shape" role="radiogroup" aria-labelledby="lbl-shape"></div>
          </div>
          <div>
            <span class="field-label"><span id="lbl-fabric" data-i18n="cfg.fabric"></span><output id="cfg-fabric-name"></output></span>
            <div class="swatches" id="cfg-fabric" role="radiogroup" aria-labelledby="lbl-fabric"></div>
          </div>
          <div>
            <label class="field-label" for="cfg-seats"><span data-i18n="cfg.seats"></span><output id="cfg-seats-out">4</output></label>
            <input class="range" type="range" id="cfg-seats" min="3" max="6" step="1" value="4">
            <div class="range-scale" aria-hidden="true"><span>3</span><span>4</span><span>5</span><span>6</span></div>
          </div>
          <div class="cfg-total">
            <div>
              <span class="field-label" style="margin-bottom:10px" data-i18n="cfg.estimate"></span>
              <div class="price" id="cfg-price" aria-live="polite"></div>
              <p data-i18n="cfg.note"></p>
            </div>
            <a class="btn" id="cfg-send" target="_blank" rel="noopener" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1120.5 12 8.5 8.5 0 018 19.4z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.6-2-1-1 .8a5 5 0 01-2.7-2.7l.8-1-1-2z"/></svg><span data-i18n="cfg.send"></span></a>
          </div>
        </div>
      </div>
    </section>

    <!-- Story -->
    <section class="section">
      <div class="container split">
        <div class="story-media">
          <div class="frame ratio-45 img-reveal"><img src="assets/stock/atelier-upholstery.jpg" alt="Upholsterer at work on a leather armchair" loading="lazy" width="1600" height="2000"></div>
          <div class="frame ratio-11 small img-reveal"><img src="assets/stock/atelier-swatches.jpg" alt="Fabric swatches and design sketches" loading="lazy" width="900" height="900"></div>
        </div>
        <div class="split-copy">
          <span class="eyebrow" data-i18n="story.eyebrow"></span>
          <h2 class="h2 reveal" data-i18n="story.title"></h2>
          <p class="lead reveal" data-delay="1" data-i18n="story.body"></p>
          <ul class="pillars reveal" data-delay="2">
            <li><span class="n">01</span><h3 data-i18n="story.p1.t"></h3><p data-i18n="story.p1.d"></p></li>
            <li><span class="n">02</span><h3 data-i18n="story.p2.t"></h3><p data-i18n="story.p2.d"></p></li>
            <li><span class="n">03</span><h3 data-i18n="story.p3.t"></h3><p data-i18n="story.p3.d"></p></li>
          </ul>
          <a class="link" href="atelier.html"><span data-i18n="story.link"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        </div>
      </div>
    </section>

    <!-- Kitchens band -->
    <section class="band section">
      <div class="container band-grid">
        <div class="frame ratio-45 img-reveal"><img src="assets/stock/kitchen-marble.jpg" alt="Dark kitchen with marble worktops" loading="lazy" width="1400" height="1750"></div>
        <div class="frame tall img-reveal"><img src="assets/stock/kitchen-walnut.jpg" alt="Walnut and black kitchen with under-cabinet light" loading="lazy" width="1200" height="2133"></div>
        <div class="band-copy">
          <span class="eyebrow" data-i18n="kit.eyebrow"></span>
          <h2 class="h2 reveal" data-i18n="kit.title"></h2>
          <p class="lead reveal" data-delay="1" data-i18n="kit.body"></p>
          <ol class="numbered reveal" data-delay="2">
            <li><span>01</span><b style="font-weight:400" data-i18n="kit.n1"></b></li>
            <li><span>02</span><b style="font-weight:400" data-i18n="kit.n2"></b></li>
            <li><span>03</span><b style="font-weight:400" data-i18n="kit.n3"></b></li>
            <li><span>04</span><b style="font-weight:400" data-i18n="kit.n4"></b></li>
          </ol>
          <div><a class="btn btn--light" href="collections.html?cat=kitchens" data-i18n="kit.cta"></a></div>
        </div>
      </div>
    </section>

    <!-- Social proof: MERINI's real audience numbers -->
    <section class="proof">
      <div class="container proof-inner">
        <span class="eyebrow" data-i18n="proof.title"></span>
        <ul class="proof-stats">
          <li class="reveal"><strong class="num">56.7K</strong><span data-i18n="at.n1"></span></li>
          <li class="reveal" data-delay="1"><strong class="num">36K</strong><span data-i18n="at.n2"></span></li>
          <li class="reveal" data-delay="2"><strong class="num">2</strong><span data-i18n="at.n3"></span></li>
          <li class="reveal" data-delay="3"><strong class="num">7</strong><span data-i18n="at.n4"></span></li>
        </ul>
        <a class="link" href="https://www.instagram.com/merinifurniture.yvn/" target="_blank" rel="noopener"><span>@merinifurniture.yvn</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      </div>
    </section>

    <!-- Visit -->
    <section class="section">
      <div class="container visit-grid">
        <figure class="frame ratio-45 img-reveal visit-photo">
          <img src="assets/sofa-bordeaux.jpg" alt="Bordeaux sofa in the MERINI showroom" loading="lazy" width="498" height="480">
          <figcaption><span data-i18n="loc1.name"></span></figcaption>
        </figure>
        <div class="split-copy">
          <span class="eyebrow" data-i18n="visit.eyebrow"></span>
          <h2 class="h2 reveal" data-i18n="visit.title"></h2>
          <div data-status></div>
        <div class="loc-list reveal" data-delay="1">
          <div class="loc">
            <h3 data-i18n="loc1.name"></h3>
            <p data-i18n="loc1.addr"></p>
            <div class="loc-actions">
              <a class="link" href="https://www.google.com/maps/search/?api=1&amp;query=Titogradyan+1%2F12+Yerevan" target="_blank" rel="noopener" data-i18n="visit.directions"></a>
              <a class="link" href="tel:+37499575111" data-i18n="visit.call"></a>
            </div>
          </div>
          <div class="loc">
            <h3 data-i18n="loc2.name"></h3>
            <p data-i18n="loc2.addr"></p>
            <div class="loc-actions">
              <a class="link" href="https://www.google.com/maps/search/?api=1&amp;query=Garage+Masters+Mall+Yerevan" target="_blank" rel="noopener" data-i18n="visit.directions"></a>
              <a class="link" href="tel:+37498535111" data-i18n="visit.call"></a>
            </div>
          </div>
        </div>
          <div class="contact-row">
            <a class="btn" href="showroom.html#book" data-i18n="nav.book"></a>
            <a class="btn btn--ghost" href="https://wa.me/37499575111" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1120.5 12 8.5 8.5 0 018 19.4z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.6-2-1-1 .8a5 5 0 01-2.7-2.7l.8-1-1-2z"/></svg>WhatsApp</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/data.js?v=7"></script>
  <script src="assets/js/i18n.js?v=7"></script>

</body>
